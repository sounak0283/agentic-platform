[project]
name = "agentic-platform"
version = "0.1.0"
description = "Natural-language multi-agent builder: brief in, compiled LangGraph endpoints out."
requires-python = ">=3.11,<3.12"
dependencies = [
    "langchain>=0.3",
    "langgraph>=0.2",
    "langchain-openai>=0.2",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "python-dotenv>=1.0",
    "langchain-google-genai>=4.4.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "e2e: makes real LLM API calls, excluded from the default test run",
]
addopts = "-m 'not e2e'"
